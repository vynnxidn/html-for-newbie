<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>apa itu div?</title>
    <style>
        /* Mengatur latar belakang halaman agar efek glassmorphism terlihat jelas */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            gap: 30px;
        }

        /* Ini selector utama untuk Card Glass-nya */
        .glass-card {
            /* Trik agar lebar card mengikuti panjang isi konten/tulisan */
            width: max-content;
            max-width: 85vw; /* Batas maksimal lebar agar tidak jebol di layar HP */
            
            /* Efek Glassmorphism (Transparansi & Blur) */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); /* Dukungan untuk Safari */
            
            /* Border tipis transparan agar terlihat seperti kaca nyata */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            
            /* Padding dan Bayangan (Shadow) */
            padding: 25px 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            
            /* Animasi transisi halus saat konten berubah */
            transition: all 0.3s ease;
        }

        /* Gaya teks di dalam card */
        .glass-card p {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            white-space: nowrap; /* Mencegah teks turun ke bawah secara otomatis agar card melebar ke samping */
        }

        /* Mengembalikan teks agar bisa turun ke bawah hanya di layar kecil (Responsif HP) */
        @media (max-width: 600px) {
            .glass-card p {
                white-space: normal;
            }
            .glass-card {
                width: auto;
            }
        }
    </style>
</head>
<body>

    <!-- Kunci utamanya ada di div ini -->
    <div class="glass-card">
        <p>meteri 01 : &lt;div&gt;</p>
    </div>
    <div class="glass-card">
        Tag &lt;div&gt; itu seperti kardus kosong tempat Anda mengelompokkan berbagai barang (teks, gambar, tombol) agar mudah diatur dan dipindahkan sekaligus.
    </div>
    <!-- Wadah Utama: Glassmorphism Card -->
<div style="
    width: max-content;
    max-width: 85vw;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    padding: 25px 40px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    display: flex;
    gap: 15px; /* Jarak antar tombol */
    align-items: center;
">

    <!-- Tombol KEMBALI (Arahkan ke index.html atau halaman sebelumnya) -->
    <a href="index.html" style="
        display: inline-block;
        padding: 10px 24px;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #ffffff;
        text-decoration: none;
        font-family: sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: 0.5px;
        white-space: nowrap;
        transition: all 0.2s ease;
    " onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'; this.style.borderColor='rgba(255, 255, 255, 0.5)'" 
       onmouseout="this.style.background='rgba(255, 255, 255, 0.15)'; this.style.borderColor='rgba(255, 255, 255, 0.2)'">
        ← Kembali
    </a>

    <!-- Tombol LANJUT (Arahkan ke halaman3.html atau halaman berikutnya) -->
    <a href="halaman3.html" style="
        display: inline-block;
        padding: 10px 24px;
        background: #ffffff; /* Tombol lanjut dibikin solid agar lebih kontras */
        border: 1px solid #ffffff;
        border-radius: 8px;
        color: #764ba2; /* Teks mengikuti warna gradasi latar belakang */
        text-decoration: none;
        font-family: sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: 0.5px;
        white-space: nowrap;
        transition: all 0.2s ease;
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    " onmouseover="this.style.opacity='0.9'; this.style.transform='translateY(-1px)'" 
       onmouseout="this.style.opacity='1'; this.style.transform='translateY(0)'">
        Lanjut →
    </a>

</div>



</body>
</html>
